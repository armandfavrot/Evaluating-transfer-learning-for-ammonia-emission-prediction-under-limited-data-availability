abstract: >-
  Because ammonia is a major air pollutant, experimental datasets describing ammonia emissions following fertilizer application have expanded considerably over recent decades. However, data availability remains highly unbalanced across fertilizer types, with abundant measurements for conventional fertilizers and only limited reliable observations for emerging products. Transfer learning offers a potential solution by leveraging knowledge learned from well-documented conditions to improve predictions under new conditions with scarce data. In this study, we evaluated whether transfer learning can improve ammonia emission prediction when only a limited number of reliable measurements are available in a specific condition of interest. Here, fertilizer origin was used to define the prediction domains, with cattle and pig slurries considered alternately as target conditions, while trials from all other fertilizer origins constituted the corresponding source domain. The number of available high-quality micrometeorological measurements in the target domain was artificially restricted. We then assessed whether recurrent neural networks pretrained on abundant source domain data and fine-tuned on a small number of target-condition trials could accurately predict ammonia emissions in the target condition. We also investigated whether alternative ammonia measurement methods, with lower reliability, including CaractAir, wind tunnels, dynamic chambers, and calibrated passive samplers, could improve prediction performance. Under ten repetitions of five-fold cross-validation, source-domain pretraining followed by full fine-tuning yielded lower median errors than training the network directly on target trials at all target sample sizes examined. However, a target mean predictor remained competitive for cattle when few target trials were available. Adding an intermediate fine-tuning stage on alternative-method trials produced modest, domain-dependent effects: it generally improved median performance for cattle with wind tunnel, CaractAir, and dynamic chamber data, but tended to increase errors for pig. Pretraining only on CaractAir or wind tunnel trials was less effective than combining source-domain pretraining with sequential fine-tuning. These results support source-domain pretraining as a useful initialization under limited target-data availability, while showing that the additional value of alternative-method data depends on the target domain and adaptation scheme.
